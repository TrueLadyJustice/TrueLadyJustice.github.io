<!DOCTYPE html>
<head>
    <title>The one and only real Lady Justice.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap');
        body {
            background: linear-gradient(143deg,rgba(87, 199, 133, 1) 0%, rgba(155, 237, 83, 1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .glass {
            /* From https://css.glass <-- love that generator! */
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2.5px);
            -webkit-backdrop-filter: blur(2.5px);
            border: 1px solid rgba(255, 255, 255, 0.16);
        }
        h1 {
            font-family: "IM Fell English", serif;
            font-weight: 700;
            font-style: normal;
            font-size: 64pt;
        }
        p {
            font-family: "IM Fell English", serif;
            font-weight: 200;
            font-style: normal;
            font-size: 30pt;
        }
    </style>
</head>
<body>
    <div class="glass">
        <h1>Lady Justice</h1>
        <p>I am the one and only,<br>real Lady Justice.</p>
    </div>
</body>
